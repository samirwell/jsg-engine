name: JSG daily update
on:
  schedule:
    - cron: '24 12 * * *'   # 7:24 AM Eastern (EST); 8:24 AM during daylight time
    - cron: '7 14 * * *'    # backup 9:07 AM EST - skips if the day already ran
    - cron: '41 16 * * *'   # backup 11:41 AM EST - skips if the day already ran
  workflow_dispatch: {}      # "Run workflow" button for a manual run
concurrency: jsg-daily
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python run_daily.py
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REPORT_TO: samir@jerseysportsgroup.com
